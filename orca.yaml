# Orca workspace configuration.
#
# THE DISPATCHER PROVISIONS AND STARTS THE BUILD, not this file. `fleet.sh`'s
# `launch` runs `scripts/fleet/setup.sh` in the new worktree and then starts one
# `claude -p` in it, so a worktree the fleet opened is provisioned and building
# whichever driver created it. That is armaatus/autofleet#151: a hook mechanism
# only one runtime has cannot be where the fleet's own steps live.
#
# What is left here is for worktrees a PERSON opens or removes through the app.
#
# Orca will ask you to trust this file before it runs anything, and again after
# each change -- these scripts execute on your machine.

scripts:
  # Runs once per new worktree -- EVERY new worktree, including the ones the
  # dispatcher opens, and that is load-bearing rather than incidental.
  # `launch` calls `runner_worktree_create` (which is where the app fires this
  # hook) at fleet.sh:1890 and its own `setup.sh` at fleet.sh:1940, so on this
  # driver the order is: the app's run FIRST and unmarked, the dispatcher's
  # second with AUTOFLEET_DISPATCHER_LAUNCH set.
  #
  # `setup.sh` is safe to run twice, and its closing stanza is written for that
  # unmarked first run: it states a condition rather than asserting "no
  # dispatcher opened this worktree", which would be false here. Do not
  # simplify it back into the assertion on the strength of this file -- reading
  # orca.yaml alone is exactly how somebody concludes the unmarked run cannot
  # happen on a fleet launch. The second run's stanza is also an invitation to
  # start an agent on a branch `start_build` is about to commit to, which is
  # why it says to ask `fleet.sh status` first. armaatus/autofleet#156, and the
  # comment this replaces had the order backwards. Found by the independent
  # review.
  setup: ./scripts/fleet/setup.sh
  # Runs when a worktree is removed through the app: tears down whatever stack
  # .autofleet/config named. `fleet.sh` runs it itself before a removal it
  # asked for, so this is the path for a removal it did not.
  archive: ./scripts/fleet/archive.sh

# Hold the agent's tab until setup finishes. Without this an agent a person
# started can run the tests before its rig is up, read the connection error as a
# code bug, and go chasing it. The few seconds this costs buys away that whole
# failure mode.
#
# UNCHANGED BY #151 AND BY #156, and it now carries a second job rather than
# the one it was written for. The hook's closing stanza -- the one naming the
# command that starts an agent -- prints at the very end of `setup.sh`, so on
# this driver it lands in the setup output only moments before the tab becomes
# usable. `wait-for-setup` is what puts it on screen BEFORE the person can
# start typing in that tab; `no-wait` would race the stanza against the reader
# it is for, on precisely the path #156 is about. The headless driver has no
# tab and no such race -- a person there ran `setup.sh` in a shell and is
# reading its output already. Named in #156's Scope, checked, and kept.
setupAgentStartupPolicy: wait-for-setup

# The prompt an agent starts with when the workspace is created from a linked
# issue. Orca treats this as a TEMPLATE, not as argv: it substitutes {{issue}}
# and {{artifact_url}} and nothing else -- there is no $1 -- and with an empty
# composer the result becomes the agent's opening prompt. Left unset, Orca's own
# default is `Complete {{artifact_url}}`, which is how an agent ends up starting
# work from a bare URL and never reads the spec. So this points the agent at
# issue-command.sh, which resolves the issue to its body, labels and milestone --
# the sole channel design intent travels through.
#
# THIS HAS NEVER BEEN OBSERVED TO TAKE EFFECT, and what the block is for is
# narrower than it looks. Until #151 the dispatcher did not rely on it at all:
# `fleet.sh`'s `agent_brief` composed the opening prompt and the runtime was
# handed it as `--prompt`, so every worktree the fleet opened got its brief
# from the dispatcher and this block was never consulted. The one creation
# path that WOULD consult it is the one left here -- a person opening a
# workspace through the app -- and the only observation of that path is
# against it: the workspace opened from a paired device on 2026-09-21 had 48
# bytes delivered to its agent tab, the length of the bare issue URL, where a
# draft rendered from this block is about ten times that.
#
# One observation is not proof the key is ignored -- it may not apply to that
# creation path, or may travel by a channel the app's delivery log does not
# record. It IS enough not to rely on it. Keep the block: it costs nothing, it
# is the documented seam, and if it does render it renders the right thing.
# But `scripts/fleet/setup.sh`'s closing stanza is what actually puts the
# command in front of a person, and unlike this block it has a test
# (`tests/test_env.sh unstarted`). armaatus/autofleet#156.
issueCommand: |
  Run `GH_PAGER=cat ./scripts/fleet/issue-command.sh {{issue}}` first and follow
  everything it prints. It resolves issue #{{issue}} ({{artifact_url}}) to its
  full body, labels and milestone -- the only place this project's design intent
  is written down -- and then states what to do with it. Nothing about the
  workflow is repeated here, so this prompt cannot drift from that script.

defaultTabs:
  # Tab 1 is the agent, opened by Orca itself.
  - title: shell
