name: unblock dependents

# GitHub has no native "blocked by" relation, so this repo uses a convention:
# an issue body carries `Blocked by #N` lines, and carries the `blocked` label
# while any of those are open. That convention is load-bearing -- it is the only
# thing stopping work from starting on an issue whose foundation has not landed
# -- so it is maintained here rather than by hand.
#
# On merge, every issue blocked by the just-closed issue is re-evaluated: if all
# of its blockers are now closed it becomes `ready`, otherwise it stays `blocked`.

on:
  pull_request:
    types: [closed]
  # `opened` and `edited` as well as the two closings, and their absence was a
  # hole with no bottom: `fleet.sh` selects on the POSITIVE `ready` label, so an
  # issue filed with no blockers carried NO label and was unstartable until some
  # unrelated issue happened to close. Every issue filed by hand got `ready` only
  # because somebody passed it on the command line -- and CLAUDE.md tells agents
  # to file and edit issues as they find things, which is exactly the path that
  # produces one nothing will ever start.
  #
  # `edited` for the other half of the same convention: CLAUDE.md says the
  # `Blocked by #N` lines are editable, and until now editing them re-derived
  # nothing, so a dependency that had genuinely been resolved kept its issue
  # blocked. The job recomputes every open issue from scratch, so firing it more
  # often is idempotent -- it costs one page of issues.
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  reconcile:
    # Only a merged PR counts; a closed-without-merge PR blocks nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;

            // Re-evaluate every open issue rather than only the dependents of
            // the issue that just closed. It is one extra API page for a
            // backlog this size, and it makes the job self-healing: a label
            // edited by hand, or a merge that bypassed this workflow, still
            // converges on the next run.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });

            const state = new Map();
            const isOpen = async (number) => {
              if (!state.has(number)) {
                try {
                  const {data} = await github.rest.issues.get({owner, repo, issue_number: number});
                  state.set(number, data.state === 'open');
                } catch (err) {
                  // A 404 is an issue that does not exist -- a typo'd number,
                  // or one from another repository -- and that blocks nothing.
                  //
                  // ANYTHING ELSE IS NOT AN ANSWER. A rate limit or a 5xx read
                  // as "closed" marks an issue `ready` whose blocker is open,
                  // and for a foundation issue that is the collision the label
                  // exists to prevent. Treated as OPEN, which leaves the issue
                  // `blocked` -- the direction that costs a wait rather than a
                  // merge conflict -- and the job is self-healing, so the next
                  // run corrects it.
                  const notFound = err && err.status === 404;
                  if (!notFound) {
                    core.warning(`could not read #${number} (${err && err.status}); ` +
                                 `treating it as OPEN, so anything it blocks stays blocked`);
                  }
                  state.set(number, !notFound);
                }
              }
              return state.get(number);
            };

            for (const issue of issues) {
              if (issue.pull_request) continue;

              const blockers = [...(issue.body || '').matchAll(/blocked\s+by\s+#(\d+)/gi)]
                .map((m) => Number(m[1]));

              // An issue that was never blocked still needs `ready`: CLAUDE.md
              // says only start a `ready` issue, so skipping these would make
              // them permanently unstartable.
              const open = [];
              for (const number of blockers) {
                if (await isOpen(number)) open.push(number);
              }

              const labels = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
              const shouldBlock = open.length > 0;
              const add = shouldBlock ? 'blocked' : 'ready';
              const remove = shouldBlock ? 'ready' : 'blocked';

              if (!labels.includes(add)) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issue.number, labels: [add],
                });
                core.info(`#${issue.number}: +${add}` +
                  (shouldBlock ? ` (waiting on ${open.map((n) => '#' + n).join(', ')})` : ''));
              }
              if (labels.includes(remove)) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: issue.number, name: remove,
                }).catch(() => {});
              }
            }
